name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV: test
  SECRET_KEY: ci-secret-key-that-is-long-enough-for-tests-0123456789
  PYTHONUNBUFFERED: '1'

jobs:
  backend:
    name: Backend — lint, types, tests, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          pip install bandit pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy app
        working-directory: backend

      - name: Tests (backend + plugins)
        run: pytest -q --cov=backend/app --cov-report=term-missing

      - name: Security scan (bandit)
        run: bandit -q -r backend/app plugins -ll

      - name: Dependency audit (pip-audit)
        # Advisory: a new CVE in a transitive dependency should not block a merge that
        # does not introduce it, but it must be visible in the log.
        continue-on-error: true
        run: pip-audit --skip-editable

      - name: Migrations apply and reverse cleanly
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
        working-directory: backend

  frontend:
    name: Frontend — types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        working-directory: frontend

      - name: Types (tsc)
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint (eslint)
        run: npx eslint src --ext .ts,.tsx
        working-directory: frontend

      - name: Tests (vitest)
        run: npx vitest run
        working-directory: frontend

      - name: Build
        run: npx vite build
        working-directory: frontend

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
