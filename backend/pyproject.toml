[project]
name = "graphintel-backend"
version = "0.1.0"
description = "GraphIntel OSINT - evidence-first, graph-centric OSINT platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",  # NoDecode, needed for comma-separated list env vars
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "dnspython>=2.6",
    "networkx>=3.3",
    "argon2-cffi>=23.1",
    # AES-256-GCM for OAuth credentials at rest (app/security/crypto.py).
    "cryptography>=41.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "idna>=3.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Ruff is configured at the repository root (ruff.toml) so backend and plugins are
# linted under one policy.

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
exclude = "(alembic|tests)"

# Pytest is configured at the repository root (pytest.ini) so one run covers
# backend/tests and every plugins/*/tests directory.
