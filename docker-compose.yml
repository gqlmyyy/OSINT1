name: graphintel

x-backend-env: &backend-env
  ENV: ${ENV:-development}
  DEBUG: ${DEBUG:-false}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env - see .env.example}
  DATABASE_URL: postgresql+asyncpg://graphintel:${POSTGRES_PASSWORD:-graphintel}@postgres:5432/graphintel
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  PLUGINS_PATH: /app/plugins
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  SEARX_BASE_URL: ${SEARX_BASE_URL:-}
  MAX_DEPTH: ${MAX_DEPTH:-3}
  MAX_ENTITIES: ${MAX_ENTITIES:-500}
  MAX_JOBS: ${MAX_JOBS:-100}
  AI_ENABLED: ${AI_ENABLED:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphintel}
      POSTGRES_DB: graphintel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U graphintel -d graphintel']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Not published to the host by default: nothing outside the compose network
    # needs to reach the database.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    expose:
      - '6379'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['api']
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['worker']
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Providers reach the public internet from here; the SSRF guard still applies.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
